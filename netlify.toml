[build]
  publish = "."
  functions = "netlify/functions"
  command = "echo 'no build step required — static index.html'"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/lean"
  to = "/.netlify/functions/lean"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
